name: Nightly e2e

# The Playwright suite against a production build and a local Supabase stack.
# It runs nightly rather than on every pull request because it takes several
# minutes, and on any pull request that changes this file.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/nightly-e2e.yml'

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        uses: ./.github/actions/setup-supabase-cli

      # The app uses Postgres, Auth, the REST API, and Realtime, and the
      # credential spec reads Mailpit. Everything else is left out to save time.
      - name: Start the local Supabase stack
        run: supabase start -x studio,imgproxy,storage,edge-runtime,analytics,vector

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # .env.test holds only the local stack's public demo keys and addresses.
      - name: Run the suite
        run: npm run test:e2e:ci

      - name: Keep traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
