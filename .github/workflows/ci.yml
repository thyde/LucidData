name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pinned to the oldest Node we support, deliberately. Running CI on a
      # newer version than the floor hides version-specific defects: Node 20
      # rejects a cross-realm ArrayBuffer where Node 22 and later accept one,
      # and that difference broke the crypto suite here while every developer
      # machine stayed green.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

# Note: Playwright end-to-end tests (npm run test:e2e) are intentionally not run
# here. They need browser downloads and a running app/Supabase stack. Add a
# separate job with `npx playwright install --with-deps` and the test:e2e:ci
# script when you want e2e coverage in CI.
