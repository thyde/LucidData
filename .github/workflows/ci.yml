name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Pinned to the oldest Node we support, deliberately. Running CI on a
      # newer version than the floor hides version-specific defects: Node 20
      # rejected a cross-realm ArrayBuffer where Node 22 and later accept one,
      # and that difference broke the crypto suite here while every developer
      # machine stayed green. Node 20 reached end of life in April 2026, so the
      # floor is now 22; realm-safety.test.ts still reproduces the old check.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Before anything is downloaded: every tarball must come from
      # registry.npmjs.org with a sha512 hash, not from a mirror a developer's
      # npm happened to use.
      - name: Check the lockfile's sources
        run: node scripts/check-lockfile.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  database:
    name: Migrations, schema lint, and security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Supabase CLI
        uses: ./.github/actions/setup-supabase-cli

      # Starting on an empty volume applies every migration in order, the same
      # as `supabase db reset`. A migration that only works on a database that
      # already exists fails here.
      - name: Build the database from every migration
        run: supabase db start

      - name: Lint the schema
        run: supabase db lint --local --fail-on error

      - name: Security invariants
        run: supabase test db

# Note: Playwright end-to-end tests run nightly in nightly-e2e.yml against a
# local Supabase stack, because they take longer than a pull request should.
